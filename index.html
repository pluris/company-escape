function bake(rows){
 let w=0;for(const r of rows)w=Math.max(w,r.length);
 const h=rows.length,c=document.createElement("canvas");
 c.width=w;c.height=h;const g=c.getContext("2d");
 for(let y=0;y<h;y++){const r=rows[y];
  for(let x=0;r&&x<r.length;x++){const ch=r[x];if(ch==="."||ch===" ")continue;
   g.fillStyle=PAL[ch]||"#ff00ff";g.fillRect(x,y,1,1);}}
 return c;
}
function whited(img){
 const c=document.createElement("canvas");c.width=img.width;c.height=img.height;
 const g=c.getContext("2d");g.drawImage(img,0,0);
 g.globalCompositeOperation="source-in";g.fillStyle="#ffffff";g.fillRect(0,0,c.width,c.height);
 return c;
}

function hexA(h,a){
 const n=parseInt(h.slice(1),16);
 return"rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")";
}
const GLOWS={};
function glow(col,r){
 const key=col+"_"+r;
 if(GLOWS[key])return GLOWS[key];
 const c=document.createElement("canvas");c.width=r*2;c.height=r*2;
 const g=c.getContext("2d");
 const gr=g.createRadialGradient(r,r,0,r,r,r);
 gr.addColorStop(0,hexA(col,.9));gr.addColorStop(.45,hexA(col,.32));gr.addColorStop(1,"rgba(0,0,0,0)");
 g.fillStyle=gr;g.fillRect(0,0,r*2,r*2);
 GLOWS[key]=c;return c;
}

let seedV=12345;
function srnd(){seedV=(seedV*1103515245+12345)&0x7fffffff;return seedV/0x7fffffff;}

function prerenderFloor(th,map){
 floorCv=document.createElement("canvas");floorCv.width=VW;floorCv.height=VH;
 floorCtx=floorCv.getContext("2d");
 seedV=999+floorIdx*77;
 const t=THEMES[th];
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  const px=x*TS,py=y*TS;
  floorCtx.fillStyle=((x+y)%2)?t.f1:t.f2;floorCtx.fillRect(px,py,TS,TS);
 }
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  const px=x*TS,py=y*TS;
  if(srnd()<.16){floorCtx.fillStyle="rgba(255,255,255,.035)";floorCtx.fillRect(px+Math.floor(srnd()*14),py+Math.floor(srnd()*14),2,1);}
  if(srnd()<.10){floorCtx.fillStyle="rgba(0,0,0,.06)";floorCtx.fillRect(px+Math.floor(srnd()*14),py+Math.floor(srnd()*14),1,2);}
 }
 if(th==="parking"){
  floorCtx.strokeStyle="#c8c8cc";floorCtx.lineWidth=1;
  for(let i=0;i<6;i++){const yy=30+i*40;floorCtx.beginPath();floorCtx.moveTo(0,yy);floorCtx.lineTo(VW,yy);floorCtx.stroke();}
  floorCtx.fillStyle="#caa53a";
  for(let i=0;i<14;i++)floorCtx.fillRect(10+srnd()*450,10+srnd()*250,2,6);
 }else if(th==="roof"){
  floorCtx.strokeStyle="#e8c93a";floorCtx.lineWidth=3;
  floorCtx.beginPath();floorCtx.arc(VW/2,80,52,0,7);floorCtx.stroke();
  floorCtx.font="bold 40px monospace";floorCtx.fillStyle="#e8c93a";
  floorCtx.textAlign="center";floorCtx.fillText("H",VW/2,94);floorCtx.textAlign="left";
 }else if(th==="lobby"){
  floorCtx.fillStyle="rgba(160,40,48,.35)";floorCtx.fillRect(200,0,80,VH);
 }else if(th==="rnd"){
  floorCtx.strokeStyle="rgba(90,180,150,.15)";
  for(let x=0;x<=MW;x+=3){floorCtx.beginPath();floorCtx.moveTo(x*TS,0);floorCtx.lineTo(x*TS,VH);floorCtx.stroke();}
  for(let y=0;y<=MH;y+=3){floorCtx.beginPath();floorCtx.moveTo(0,y*TS);floorCtx.lineTo(VW,y*TS);floorCtx.stroke();}
 }else if(th==="exec"){
  floorCtx.fillStyle="rgba(244,197,66,.12)";
  for(let x=0;x<MW;x++)if(x%5===0)floorCtx.fillRect(x*TS,0,2,VH);
 }
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  const ch=map[y][x],px=x*TS,py=y*TS;
  if(ch==="#"){
   floorCtx.fillStyle=t.w;floorCtx.fillRect(px,py,TS,TS);
   floorCtx.fillStyle=t.wt;floorCtx.fillRect(px,py,TS,4);
   floorCtx.fillStyle="rgba(0,0,0,.25)";floorCtx.fillRect(px,py+TS-2,TS,2);
  }
 }
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  if(map[y][x]!=="C")continue;
  let w=1,h=1;
  while(x+w<MW&&map[y][x+w]==="C")w++;
  outer:while(y+h<MH){for(let k=0;k<w;k++)if(map[y+h][x+k]!=="C")break outer;h++;}
  drawCover(floorCtx,x*TS,y*TS,w*TS,h*TS,t.cov);
 }
 for(let y=1;y<MH;y++)for(let x=0;x<MW;x++){
  if(map[y][x]==="#"||map[y-1][x]!=="#")continue;
  const px=x*TS,py=y*TS;
  const gr=floorCtx.createLinearGradient(0,py,0,py+7);
  gr.addColorStop(0,"rgba(0,0,0,.34)");gr.addColorStop(1,"rgba(0,0,0,0)");

function tileAt(tx,ty){
 if(tx<0||ty<0||tx>=MW||ty>=MH)return 1;
 return grid[ty*MW+tx];
}
function solidForMove(tx,ty,flying){
 const t=tileAt(tx,ty);
 if(t===1||t===4)return true;
 if(flying)return false;
 return t===2||t===3;
}
function circleHitsSolid(x,y,r,flying){
 const off=[[-r*.7,-r*.7],[r*.7,-r*.7],[-r*.7,r*.7],[r*.7,r*.7],[r,0],[-r,0],[0,r],[0,-r]];
 for(const o of off){
  if(solidForMove(Math.floor((x+o[0])/TS),Math.floor((y+o[1])/TS),flying))return true;
 }
 return false;
}
function moveEnt(e,dx,dy,flying){
 if(dx!==0){const nx=e.x+dx;if(!circleHitsSolid(nx,e.y,e.r,flying))e.x=nx;}
 if(dy!==0){const ny=e.y+dy;if(!circleHitsSolid(e.x,ny,e.r,flying))e.y=ny;}
 e.x=Math.max(8,Math.min(VW-8,e.x));
 e.y=Math.max(10,Math.min(VH-6,e.y));
}
function los(x0,y0,x1,y1){
 const d=Math.hypot(x1-x0,y1-y0),steps=Math.ceil(d/6);
 for(let i=1;i<steps;i++){
  const tt=i/steps,tx=Math.floor((x0+(x1-x0)*tt)/TS),ty=Math.floor((y0+(y1-y0)*tt)/TS);
  const t=tileAt(tx,ty);
  if(t===1||t===4)return false;
 }
 return true;
}
function rayEnd(x0,y0,ang,max){
 const cx=Math.cos(ang),cy=Math.sin(ang);
 for(let d=4;d<max;d+=4){
  const tx=Math.floor((x0+cx*d)/TS),ty=Math.floor((y0+cy*d)/TS);
  if(tileAt(tx,ty)>=1)return{x:x0+cx*d,y:y0+cy*d};
 }
 return{x:x0+cx*max,y:y0+cy*max};
}

   note("triangle",[69,72,76,72][Math.floor(s/2)%4],mus.next,bd*.7,.045);

 kills=0;deaths=0;playTime=0;
}
function beginFloor(i,retry){
 const keep=player?player.hp:100;
 floorIdx=i;
 parseFloor(i);
 if(retry){player.hp=100;ammo.shotgun+=4;ammo.smg+=20;ammo.stapler+=6;ammo.revolver+=2;ammo.toner+=1;ammo.homing+=2;ammo.pen+=1;}
 else player.hp=Math.max(1,keep);
 pushToast(FLOORS[i].name+" · "+FLOORS[i].sub,"#f4c542");
 pushToast(FLOORS[i].toast,"#9aa3b2");
 setMusic(i===FLOORS.length-1?"calm":"calm");
 state="play";
}
function gotoNextFloor(){
 sfx("elev");
 const nxt=FLOORS[floorIdx+1];
 const label=nxt?nxt.name+" · "+nxt.sub:null;
 if(floorIdx===0){
  startTrans(function(){
   showDialog(EXIT0,function(){startTrans(function(){beginFloor(1);},FLOORS[1].name+" · "+FLOORS[1].sub);});
  },label);
 }else{
  startTrans(function(){beginFloor(floorIdx+1);},label);
 }
}
function retryFloor(){
 beginFloor(floorIdx,true);
}
function startRun(){
 initAudio();resetGear();
 player=null;
 showDialog(INTRO,function(){startTrans(function(){beginFloor(0);});});
}
function resetRun(toIntro){
 resetGear();player=null;
 if(toIntro)showDialog(INTRO,function(){startTrans(function(){beginFloor(0);});});
 else state="title";
}

function alertNear(x,y,r){
 for(const e of enemies){
  if(!e.dead&&!e.static&&Math.hypot(e.x-x,e.y-y)<r)e.alert=true;
 }
}
function shoot(x,y,ang,spec,from,color,size,pierceGlass){
 bullets.push({x:x,y:y,vx:Math.cos(ang)*spec.spd,vy:Math.sin(ang)*spec.spd,
  dmg:spec.dmg,from:from,life:spec.life||1.1,size:size||2,
  color:color||(from==="p"?"#ffe9a8":"#ff6b57"),crit:spec.crit||false,pierce:pierceGlass||false});
}
function damagePane(tx,ty){
 const k=ty*MW+tx;
 if(!(k in glassHp))return false;
 glassHp[k]--;
 for(let i=0;i<6;i++)parts.push({x:tx*TS+8,y:ty*TS+8,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60-20,g:160,life:.5,col:"#57c8e8",sz:1});
 if(glassHp[k]<=0){delete glassHp[k];grid[k]=0;sfx("glass");return true;}
 sfx("hit");return false;
}
function doFire(){
 const w=curWpn,spec=WPN[w];
 if(w==="ext"){
  if(player.pressure<=1){player.fireCd=.1;return;}
  player.fireCd=spec.rate;
  player.pressure=Math.max(0,player.pressure-spec.drain);
  player.muzzle=.03;
  for(let i=0;i<3;i++){
   const a=player.aim+(Math.random()-.5)*spec.spread;
   const bl={x:player.x+Math.cos(a)*8,y:player.y-12+Math.sin(a)*8,
    vx:Math.cos(a)*(130+Math.random()*70),vy:Math.sin(a)*(130+Math.random()*70),
    dmg:spec.dmg,from:"p",life:.2,size:3,color:"#cfe9ff",knock:true};
   bullets.push(bl);
  }
  sfx("spray");
  alertNear(player.x,player.y,90);
  return;
 }
 player.fireCd=spec.rate;player.muzzle=.06;player.recoil=3;
 alertNear(player.x,player.y,170);
 if(w==="case"){
  player.swing=.16;sfx("swing");
  const a=player.aim;
  for(const e of enemies){
   if(e.dead||(e.type==="ceo"&&!e.alert))continue;
   const d=Math.hypot(e.x-player.x,e.y-player.y);
   let da=Math.atan2(e.y-player.y,e.x-player.x)-a;
   while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
   if(d<44&&Math.abs(da)<1.25){
    moveEnt(e,Math.cos(a)*9,Math.sin(a)*9,e.fly);
    damage(e,spec.dmg,a);
    if(!e.static&&!e.boss)e.stunT=Math.max(e.stunT||0,.22);
   }
  }
  for(const b of bullets){
   if(b.from!=="e")continue;
   const d=Math.hypot(b.x-player.x,b.y-player.y);
   if(d<50){
    b.from="p";b.color="#ffe9a8";
    const na=a+(Math.random()-.5)*.4;
    const sp=Math.hypot(b.vx,b.vy)*1.25;
    b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
    sfx("reflect");
   }
  }
  const px=player.x+Math.cos(a)*30,py=player.y-12+Math.sin(a)*30;
  const tx=Math.floor(px/TS),ty=Math.floor(py/TS);
  if(tileAt(tx,ty)===3)damagePane(tx,ty);
  return;
 }
 if(w==="chair"){
  sfx("dash");
  shake.t=.08;shake.m=1.5;player.recoil=5;
  bullets.push({x:player.x,y:player.y-12,
   vx:Math.cos(player.aim)*300,vy:Math.sin(player.aim)*300,
   dmg:spec.dmg,from:"p",life:2.4,size:5,color:"#e0a458",
   chair:true,hitIds:{},rot:0,t2:0});
  return;
 }
 if(w==="stapler"){
  if(ammo.stapler<=0){sfx("ui");player.fireCd=.2;return;}
  ammo.stapler--;
  for(let i=0;i<3;i++)player.pend.push({t:i*.07});
  sfx("stap");
  return;
 }
 if(w==="revolver"){
  if(ammo.revolver<=0){sfx("ui");player.fireCd=.2;return;}
  ammo.revolver--;
  shoot(player.x,player.y-12,player.aim+(Math.random()-.5)*.02,{dmg:spec.dmg,spd:spec.spd},"p","#ffd166",2);
  const rb=bullets[bullets.length-1];
  rb.pierceN=2;rb.hitIds={};
  shake.t=.13;shake.m=2;sfx("mag");
  return;
 }
 if(w==="toner"){
  if(ammo.toner<=0){sfx("ui");player.fireCd=.2;return;}
  ammo.toner--;
  player.fireCd=spec.rate;player.recoil=4;
  const txp=clamp(player.x+Math.cos(player.aim)*110,16,VW-16);
  const typ=clamp(player.y-12+Math.sin(player.aim)*110,16,VH-16);
  lobs.push({sx:player.x,sy:player.y-12,tx:txp,ty:typ,t:0,dur:.75});
  sfx("swing");
  alertNear(player.x,player.y,120);
  return;
 }
 if(w==="homing"){
  if(ammo.homing<=0){sfx("ui");player.fireCd=.2;return;}
  ammo.homing--;
  player.fireCd=spec.rate;player.muzzle=.05;
  shoot(player.x,player.y-12,player.aim,{dmg:spec.dmg,spd:spec.spd,life:2.2},"p","#4dd7fe",3);
  bullets[bullets.length-1].homing=true;
  sfx("home");
  alertNear(player.x,player.y,170);
  return;
 }
 if(w==="pen"){
  if(ammo.pen<=0){sfx("ui");player.fireCd=.2;return;}
  ammo.pen--;
  player.fireCd=spec.rate;player.muzzle=.08;player.recoil=6;
  shake.t=.15;shake.m=2.5;
  const ex0=player.x,ey0=player.y-12;
  const ep2=rayEnd(ex0,ey0,player.aim,320);
  beams.push({x0:ex0,y0:ey0,x1:ep2.x,y1:ep2.y,t:.14});
  flashes.push({x:ep2.x,y:ep2.y,t:.2});
  const vx2=ep2.x-ex0,vy2=ep2.y-ey0,L2=vx2*vx2+vy2*vy2||1;
  for(const e of enemies){
   if(e.dead||(e.type==="ceo"&&!e.alert))continue;
   let tt=((e.x-ex0)*vx2+((e.y-8)-ey0)*vy2)/L2;
   tt=clamp(tt,0,1);
   if(Math.hypot(e.x-(ex0+vx2*tt),(e.y-8)-(ey0+vy2*tt))<e.r+5){
    damage(e,spec.dmg,Math.atan2(vy2,vx2),true);
    if(!e.static&&!e.boss)e.stunT=Math.max(e.stunT||0,.25);
   }
  }
  sfx("pen");
  alertNear(player.x,player.y,220);
  return;
 }
 if(w==="shotgun"){
  if(ammo.shotgun<=0){sfx("ui");player.fireCd=.2;return;}
  ammo.shotgun--;
  for(let i=0;i<spec.pellets;i++)
   shoot(player.x,player.y-12,player.aim+(Math.random()-.5)*spec.spread,{dmg:spec.dmg,spd:spec.spd*(0.85+Math.random()*.3),life:spec.life},"p");
  shake.t=.12;shake.m=2;sfx("shotgun");
 }else if(w==="smg"){
  if(ammo.smg<=0){sfx("ui");player.fireCd=.2;return;}
  ammo.smg--;
  shoot(player.x,player.y-12,player.aim+(Math.random()-.5)*spec.spread,{dmg:spec.dmg,spd:spec.spd},"p","#fff2c8");
  sfx("smg");
 }else if(w==="card"){
  const crit=Math.random()<.25;
  shoot(player.x,player.y-12,player.aim+(Math.random()-.5)*spec.spread,{dmg:crit?30:spec.dmg,spd:spec.spd,crit:crit},"p",crit?"#ffd166":"#f5f6fa",1);
  sfx("card");
  }else{
   shoot(player.x,player.y-12,player.aim+(Math.random()-.5)*spec.spread,{dmg:spec.dmg,spd:spec.spd},"p");
   sfx("shoot");
  }
 }

function damage(e,dmg,srcAng,isBullet){
 if(e.dead)return;
 if(e.type==="ceo"){
  if(!e.alert)return;
  if(e.invuln>0)return;
  dmg*=e.vuln||1;
 }
 if(e.type==="shield"&&isBullet!==undefined){
  let da=srcAng-e.faceAng;
  while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
  if(Math.abs(da)<.9){
   dmg*=.15;
   parts.push({x:e.x,y:e.y-8,vx:0,vy:-10,g:0,life:.2,col:"#57c8e8",sz:2});
  }
 }
 e.hp-=dmg;e.flash=.08;e.alert=true;
 for(let i=0;i<3;i++)parts.push({x:e.x,y:e.y-8,vx:(Math.random()-.5)*70,vy:(Math.random()-.5)*70-20,g:200,life:.35,col:"#c43b44",sz:1});
 alertNear(e.x,e.y,110);
 if(e.hp<=0)kill(e);
 else sfx("hit");
}
function kill(e){
 e.dead=true;kills++;
 stampCorpse(e);
 hitStop=Math.max(hitStop,e.boss?.07:.024);
 whiteFlash=Math.max(whiteFlash,e.boss?.14:.05);
 if(e.type==="ceo"){bossDown();return;}
 sfx("die");
 for(let i=0;i<8;i++){
  const a=Math.random()*7;
  parts.push({x:e.x,y:e.y-8,vx:Math.cos(a)*(30+Math.random()*60),vy:Math.sin(a)*(30+Math.random()*60)-20,g:180,life:.5,col:"#ff5964",sz:1});
 }
 if(e.type==="chief"){
  pickups.push({kind:"med",x:e.x,y:e.y,t:0});
  if(!wpn.revolver)pickups.push({kind:"wpn",sub:"revolver",x:e.x+10,y:e.y,t:.4});
  shake.t=.25;shake.m=3;
 }
}
function stampCorpse(e){
 if(!floorCtx)return;
 const spr=e.type==="clone"?SPR.exec:spriteOf(e);
 floorCtx.save();
 floorCtx.globalAlpha=.55;
 floorCtx.fillStyle="#5c1420";
 floorCtx.beginPath();
 floorCtx.ellipse(e.x,e.y-2,5+Math.random()*4,3+Math.random()*2,0,0,7);
 floorCtx.fill();
 floorCtx.globalAlpha=.8;
 floorCtx.translate(e.x,e.y);
 floorCtx.rotate((Math.random()-.5)*.5);
 floorCtx.scale(CHS,CHS);
 floorCtx.drawImage(spr,-spr.width/2,-spr.height+4);
 floorCtx.restore();
}
function spriteOf(e){
 return SPR[e.type==="mgr"?e.type:e.type==="clone"?"exec":e.type]||SPR.guard;
}
function hurtPlayer(dmg,srcAng){
 if(!player||player.inv>0||player.roll>0||state!=="play")return;
 player.hp-=dmg;player.inv=.75;player.flashRed=.25;
 shake.t=.18;shake.m=2.5;sfx("hurt");
 const kb=40;
 moveEnt(player,-Math.cos(srcAng)*kb*dtSafe(),-Math.sin(srcAng)*kb*dtSafe(),false);
 for(let i=0;i<6;i++)parts.push({x:player.x,y:player.y-8,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90-30,g:220,life:.4,col:"#c43b44",sz:1});
 if(player.hp<=0){
  player.hp=0;deaths++;state="over";sfx("roar");
 }
}
let lastDt=0.016;
function dtSafe(){return lastDt;}

function explode(x,y,r,dmg,hurtEnemies){
 sfx("boom");shake.t=.3;shake.m=4;hitStop=Math.max(hitStop,.02);
 flashes.push({x:x,y:y,t:.24});
 parts.push({x:x,y:y,vx:0,vy:0,g:0,life:.32,col:"#ffb347",sz:r*.6,ring:true});
 for(let i=0;i<18;i++){
  const a=Math.random()*7,s=40+Math.random()*90;
  parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:100,life:.4+Math.random()*.3,col:i%2?"#ffb347":"#ff5964",sz:2});
 }
 for(let i=0;i<10;i++){
  const a=Math.random()*7,s=15+Math.random()*50;
  parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,g:-20,life:.7+Math.random()*.5,col:"#3a3f4d",sz:4+Math.random()*4,k:"smoke"});
 }
 for(let i=0;i<8;i++){
  const a=Math.random()*7,s=60+Math.random()*120;
  parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:60,life:.35+Math.random()*.25,col:"#ffd166",sz:2,k:"ember"});
 }
 const pd=Math.hypot(player.x-x,(player.y-8)-y);
 if(pd<r+player.r)hurtPlayer(dmg*(1-pd/(r+player.r)*.5)+8,Math.atan2(player.y-y,player.x-x));
 if(hurtEnemies){
  for(const e of enemies){
   if(e.dead||e.type==="ceo")continue;
   const d=Math.hypot(e.x-x,e.y-y);
   if(d<r+e.r)damage(e,dmg*.8,Math.atan2(e.y-y,e.x-x));
  }
  if(bossRef&&!bossRef.dead&&bossRef.alert){
   const d=Math.hypot(bossRef.x-x,bossRef.y-y);
   if(d<r+bossRef.r)damage(bossRef,dmg*.5,0);
  }
 }
}

function spawnClone(x,y){
 const c=spawnEnemy("clone",x,y);
 c.alert=true;c.alpha=.72;
 parts.push({x:x,y:y,vx:0,vy:0,g:0,life:.25,col:"#9aa3b2",sz:8,ring:true});
}

function bossDown(){
 bossActive=false;
 bullets.length=0;warns.length=0;lobs.length=0;
 for(const e of enemies)if(!e.dead&&e.type!=="ceo")e.dead=true;
 shake.t=.6;shake.m=5;sfx("boom");sfx("roar");
 winT=1.4;
 for(let i=0;i<40;i++){
  const a=Math.random()*7,s=30+Math.random()*140;
  parts.push({x:bossRef.x,y:bossRef.y-10,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:150,life:.6+Math.random()*.5,col:["#f4c542","#ffb347","#6b6b6b"][i%3],sz:2});
 }
}
function eShoot(e,ang,dmg,spd,col,size,pierce){
 shoot(e.x,e.y-12,ang,{dmg:dmg,spd:spd},"e",col||"#ff6b57",size||2,pierce);
}
function ringShot(e,n,spd,dmg,col){
 const base=Math.random()*7;
 for(let i=0;i<n;i++)eShoot(e,base+i/n*Math.PI*2,dmg,spd,col);
}
function tryBurst(e,n,interval,cdBase,mk){
 if(e.burst>0){
  e.bt-=lastDt;
  if(e.bt<=0){mk();e.burst--;e.bt=interval;}
 }else{
  e.cool-=lastDt;
  if(e.cool<=0){e.burst=n;e.bt=0;e.cool=cdBase+Math.random()*.6;}
 }
}
function seekBand(e,min,max,dt,sp){
 const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
 let mx=0,my=0;
 if(d>max){mx=dx/d;my=dy/d;}
 else if(d<min){mx=-dx/d;my=-dy/d;}
 else{const s=Math.sin(e.t*2.2)*e.strafe;mx=-dy/d*s;my=dx/d*s;}
 moveEnt(e,mx*sp*dt,my*sp*dt,e.fly);
 e.moving=Math.abs(mx)+Math.abs(my)>.1;
}

function triggerAlarm(){
 alarmDone=true;alarmActive=true;
 sfx("alarm");
 pushToast("경보 발생!! 증원이 옵니다","#d93a3a");
 const corners=[[VW-60,40],[40,VH-56]];
 let best=null,bd=-1;
 for(const c of corners){
  const d=Math.hypot(c[0]-player.x,c[1]-player.y);
  if(d>bd){bd=d;best=c;}
 }
 for(let i=0;i<2;i++){
  const g=spawnEnemy("guard",best[0]+i*14,best[1]+(i?10:-6));
  g.alert=true;
 }
 for(const e of enemies)e.alert=true;
}

function updateEnemy(e,dt){
 e.flash=Math.max(0,e.flash-dt);
 e.contactCd=Math.max(0,e.contactCd-dt);
 e.t+=dt;
 if(e.stunT>0&&!e.boss){e.stunT-=dt;return;}
 if(e.type==="ceo"){if(e.alert)updateCEO(e,dt);return;}
 const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);
 const seen=d<260&&los(e.x,e.y,player.x,player.y);
 if(!e.alert){
  if((seen&&d<150)||d<55){e.alert=true;}
  else{
   if(!e.static){
    e.wt=(e.wt||0)-dt;
    if(e.wt<=0){e.wt=1.5+Math.random()*2;e.tx=e.x0+(Math.random()-.5)*50;e.ty=e.y0+(Math.random()-.5)*40;}
    const wx=e.tx-e.x,wy=e.ty-e.y,wd=Math.hypot(wx,wy);
    if(wd>6){moveEnt(e,wx/wd*e.spd*.35*dt,wy/wd*e.spd*.35*dt,false);e.moving=true;}else e.moving=false;
   }
   return;
  }
 }
 e.faceAng=Math.atan2(dy,dx);
 e.face=dx>=0?1:-1;
 e.moving=false;
 switch(e.type){
 case"guard":
  seekBand(e,110,170,dt,e.spd);
  tryBurst(e,2,.17,1.5,function(){
   eShoot(e,e.faceAng+(Math.random()-.5)*.09,8,190);
   sfx("shoot");
  });
  break;
 case"worker":
  if(e.st==="windup"){
   e.stT-=dt;
   moveEnt(e,Math.cos(e.faceAng)*60*dt,Math.sin(e.faceAng)*60*dt,false);
   if(e.stT<=0){
    if(d<30){hurtPlayer(12,e.faceAng);}
    e.st="idle";e.cool=.9;
   }
  }else{
   moveEnt(e,dx/d*e.spd*dt,dy/d*e.spd*dt,false);e.moving=true;
   if(d<20&&e.cool<=0){e.st="windup";e.stT=.28;sfx("swing");}
   e.pd-=dt;
   if(d>90&&e.pd<=0&&seen){e.pd=2.8;eShoot(e,e.faceAng+(Math.random()-.5)*.06,6,150,"#f2f2f2");}
  }
  break;
 case"mgr":
 case"clone":
  seekBand(e,130,210,dt,e.spd);
  tryBurst(e,2,.15,2.1,function(){
   eShoot(e,e.faceAng+(Math.random()-.5)*.07,e.type==="clone"?6:7,225);
   sfx("shoot");
  });
  break;
 case"drone":
  if(e.st==="aim"){
   e.stT-=dt;
   if(e.stT<=0){e.st="dive";e.tx=player.x;e.ty=player.y;sfx("dash");}
  }else if(e.st==="dive"){
   const ddx=e.tx-e.x,ddy=e.ty-e.y,dd=Math.hypot(ddx,ddy);
   if(dd<8){e.st="hover";e.cool=1.8;}
   else{
    const nx=e.x+ddx/dd*250*dt,ny=e.y+ddy/dd*250*dt;
    if(circleHitsSolid(nx,ny,e.r,true)){e.st="hover";e.cool=1.8;}
    else{e.x=nx;e.y=ny;}
   }
  }else{
   const ox=player.x+Math.cos(e.t*1.3)*36,oy=player.y+Math.sin(e.t*1.7)*24;
   const vx=ox-e.x,vy=oy-e.y,vd=Math.hypot(vx,vy)||1;
   moveEnt(e,vx/vd*e.spd*dt,vy/vd*e.spd*dt,true);e.moving=vd>8;
   e.cool-=dt;
   if(e.cool<=0&&seen){e.st="aim";e.stT=.35;}
  }
  break;
 case"printer":
  if(seen&&d<270){
   e.cool-=dt;
   if(e.cool<=0){e.volley=3;e.vt=0;e.cool=2.4;}
  }
  if(e.volley>0){
   e.vt-=dt;
   if(e.vt<=0){
    eShoot(e,e.faceAng+(Math.random()-.5)*.1,9,215,"#f2f2f2",2,true);
    e.volley--;e.vt=.13;sfx("smg");
   }
  }
  break;
 case"shield":
  seekBand(e,80,120,dt,e.spd);
  tryBurst(e,4,.09,1.9,function(){
   eShoot(e,e.faceAng+(Math.random()-.5)*.12,5,200);
   sfx("smg");
  });
  break;
 case"cctv":
  if(!e.alert){e.faceAng+=dt*.6;break;}
  if(e.lock>0){
   e.lock-=dt;
   if(e.lock<=0){e.fire=.5;sfx("laserfire");e.tick=0;}
  }else if(e.fire>0){
   e.fire-=dt;
   e.tick-=dt;

 if(A.name==="fan"){

 }else if(A.name==="bomb"){

   A.n++;

    ty:clamp(player.y+(Math.random()-.5)*60,16,VH-16),t:0,dur:.85});

 }else if(A.name==="missile"){

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function separation(){

  if(a.dead||a.fly||a.static||a.boss)continue;
  for(let j=i+1;j<enemies.length;j++){
   const b=enemies[j];
   if(b.dead||b.fly||b.static||b.boss)continue;
   const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),md=(a.r+b.r)*.9;
   if(d<md&&d>0){

function updateBullets(dt){
 for(let bi=bullets.length-1;bi>=0;bi--){
  const b=bullets[bi];
  if(!b)continue;
  b.life-=dt;
   if(b.life<=0){bullets.splice(bi,1);continue;}
   if(b.homing){
    let tgt=null,best=150;
    for(const e of enemies){
     if(e.dead)continue;
     const d=Math.hypot(e.x-b.x,(e.y-8)-b.y);
     if(d<best){best=d;tgt=e;}
    }
    if(tgt){
     const want=Math.atan2((tgt.y-8)-b.y,tgt.x-b.x);
     const cur=Math.atan2(b.vy,b.vx);
     let da=want-cur;
     while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
     const mx=3.4*dt;
     da=Math.max(-mx,Math.min(mx,da));
     const ang=cur+da;
     const sp=Math.min(180,Math.hypot(b.vx,b.vy)+90*dt);
     b.vx=Math.cos(ang)*sp;b.vy=Math.sin(ang)*sp;
    }
    if(Math.random()<.4)parts.push({x:b.x,y:b.y,vx:0,vy:0,g:0,life:.22,col:"#4dd7fe",sz:1});
   }
   if(b.chair){
   b.rot+=dt*22;
   b.t2+=dt;
   const dxp=player.x-b.x,dyp=(player.y-12)-b.y;
   const dp=Math.hypot(dxp,dyp)||1;
   if(b.t2<.5){
    const dr=Math.pow(.35,dt);
    b.vx*=dr;b.vy*=dr;
   }else{
    b.vx+=dxp/dp*950*dt;b.vy+=dyp/dp*950*dt;
    const sp=Math.hypot(b.vx,b.vy);
    if(sp>400){b.vx*=400/sp;b.vy*=400/sp;}
   }
   const nx2=b.x+b.vx*dt,ny2=b.y+b.vy*dt;
   if(circleHitsSolid(nx2,ny2,4,false)){b.vx*=-.75;b.vy*=-.75;sfx("clack");}
   else{b.x=nx2;b.y=ny2;}
   for(const e of enemies){
    if(e.dead)continue;
    if((b.hitIds[e.id]||0)>tGlobal-.4)continue;
    if(Math.hypot(e.x-b.x,(e.y-8)-b.y)<e.r+7){
     b.hitIds[e.id]=tGlobal;
     damage(e,b.dmg,Math.atan2(b.vy,b.vx));
     if(!e.static&&!e.boss)e.stunT=Math.max(e.stunT||0,.35);
    }
   }
   if(b.t2>.5&&dp<11)bullets.splice(bi,1);
   continue;
  }  const steps=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/4));
  let dead=false;
  for(let s=0;s<steps&&!dead;s++){
   b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;
   if(b.x<0||b.x>VW||b.y<0||b.y>VH){dead=true;break;}
   const tx=Math.floor(b.x/TS),ty=Math.floor(b.y/TS);
   const tt=tileAt(tx,ty);
   if(tt===3){
    if(!b.pierce){damagePane(tx,ty);dead=true;break;}
   }else if(tt===1||tt===2||tt===4){
    dead=true;
    parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40,g:0,life:.15,col:"#8b91a0",sz:1});
    break;
   }
   if(b.from==="p"){
    for(const e of enemies){
     if(e.dead)continue;
     if(e.type==="ceo"&&!e.alert)continue;
     if(Math.hypot(e.x-b.x,(e.y-8)-b.y)<e.r+b.size+1){
      if(b.pierceN!==undefined){
       if(b.hitIds[e.id])continue;
       b.hitIds[e.id]=1;
       damage(e,b.dmg,Math.atan2(b.vy,b.vx),true);
       if(b.pierceN>0)b.pierceN--;
       else dead=true;
      }else{
       damage(e,b.dmg,Math.atan2(b.vy,b.vx),true);
       dead=true;
      }
      if(!dead&&b.knock&&!e.static){
       e.stunT=Math.max(e.stunT||0,.28);
       const kn=Math.hypot(b.vx,b.vy)||1;
       moveEnt(e,b.vx/kn*7,b.vy/kn*7,false);
       parts.push({x:e.x,y:e.y-10,vx:(Math.random()-.5)*60,vy:-20-Math.random()*30,g:60,life:.3,col:"#cfe9ff",sz:2});
      }
      if(dead)break;
     }
    }
   }else{
    if(player.roll<=0&&player.inv<=0&&Math.hypot(player.x-b.x,(player.y-8)-b.y)<player.r+b.size+1){
     hurtPlayer(b.dmg,Math.atan2(b.vy,b.vx));
     dead=true;
    }
   }
  }
  if(dead)bullets.splice(bi,1);
 }
}

function wrapText(s,x,y,maxW,lh,col,size){
 ctx.font=size+"px monospace";ctx.fillStyle=col;
 let line="";

  const test=line+ch;

const SPK_COL={"도혁":"#4dd7fe","CEO 강만재":"#ff4757"};
function rrU(g,x,y,w,h,r){
 g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);
 g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
const UI_FONT="'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
function wrapU(g,s,x,y,maxW,lh){
 let line="";
 for(const ch of s){
  const t=line+ch;
  if(g.measureText(t).width>maxW&&line){g.fillText(line,x,y);y+=lh;line=ch;}
  else line=t;
 }
 if(line)g.fillText(line,x,y);
 return y+lh;
}
